# this is meant for Perlmutter, not Euler

# postprocessing
- name: fiducial_webdatasets
  cmd: esub ../../msfm/apps/run_fiducial_postprocessing.py \
    --n_files=1000 \
    --config=../../configs/marcel/simple.yaml \
    --dir_in=/global/cfs/cdirs/des/cosmogrid/processed/v11desy3/CosmoGrid/bary \
    --dir_out=/pscratch/sd/a/athomsen/v11desy3/marcel/webdatasets/fiducial \
    --cosmogrid_version="1.1" \
    --mode=jobarray --function=all --n_jobs=1000 --max_njobs=1000 --tasks="0>1000" --keep_submit_files \
    --job_name=wds_fidu_marcel --log_dir=/pscratch/sd/a/athomsen/run_files/marcel/esub_logs \
    --system=slurm --source_file=../../pipelines/marcel/perlmutter_setup.sh \
    --additional_slurm_args="--account=des,--constraint=cpu,--qos=shared,--licenses=cfs,--licenses=scratch"

- name: grid_webdatasets
  cmd: esub ../../msfm/apps/run_grid_postprocessing.py \
    --n_files=2500 \
    --config=../../configs/marcel/simple.yaml \
    --dir_in=/global/cfs/cdirs/des/cosmogrid/processed/v11desy3/CosmoGrid/bary \
    --dir_out=/pscratch/sd/a/athomsen/v11desy3/marcel/webdatasets/grid \
    --cosmogrid_version="1.1" \
    --mode=jobarray --function=all --n_jobs=2500 --max_njobs=1000 --tasks="0>2500" --keep_submit_files \
    --job_name=wds_grid_marcel --log_dir=/pscratch/sd/a/athomsen/run_files/marcel/esub_logs \
    --system=slurm --source_file=../../pipelines/marcel/perlmutter_setup.sh \
    --additional_slurm_args="--account=des,--constraint=cpu,--qos=shared,--licenses=cfs,--licenses=scratch"

# noise generation for the Cls
- name: cl_white_noise
  cmd: esub ../../msfm/apps/run_power_spectra_noise.py \
    --n_noise=100000 \
    --n_noise_per_index=1000 \
    --config=../../configs/marcel/simple.yaml \
    --dir_out=/pscratch/sd/a/athomsen/v11desy3/marcel/cls \
    --mode=jobarray --function=all --system=slurm \
    --job_name=white_noise --log_dir=/pscratch/sd/a/athomsen/run_files/marcel/esub_logs \
    --additional_slurm_args="--account=des,--constraint=cpu,--qos=shared,--licenses=cfs,--licenses=scratch"
